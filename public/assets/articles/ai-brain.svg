<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <radialGradient id="aiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E0D2C" />
      <stop offset="100%" stop-color="#03050F" />
    </radialGradient>
    <filter id="neonPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#aiBg)" rx="14" />

  <!-- Digital Neural Mesh Lines -->
  <g stroke="#168BFF" stroke-opacity="0.15" stroke-width="1">
    <circle cx="200" cy="115" r="90" stroke-dasharray="3 6" />
    <circle cx="200" cy="115" r="65" stroke-dasharray="2 4" />
  </g>

  <!-- Left Hemisphere (Neon Pink / Violet) -->
  <path d="M195 55C165 55 130 75 125 105C120 135 140 160 160 172C175 180 190 182 195 184" 
        stroke="#FF36B7" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonPink)" />
  <!-- Left Sulci/Gyri curves -->
  <path d="M195 75C170 78 150 92 148 112C145 130 160 148 178 155" 
        stroke="#FF36B7" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M195 95C180 98 165 110 165 125C165 138 175 145 195 148" 
        stroke="#925CFF" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M170 100C155 105 140 118 140 132" 
        stroke="#FF36B7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Right Hemisphere (Cyan / Electric Blue) -->
  <path d="M205 55C235 55 270 75 275 105C280 135 260 160 240 172C225 180 210 182 205 184" 
        stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#neonBlue)" />
  <!-- Right Sulci/Gyri curves -->
  <path d="M205 75C230 78 250 92 252 112C255 130 240 148 222 155" 
        stroke="#168BFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M205 95C220 98 235 110 235 125C235 138 225 145 205 148" 
        stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M230 100C245 105 260 118 260 132" 
        stroke="#168BFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Synaptic Spark Dots -->
  <circle cx="135" cy="95" r="3.5" fill="#FF36B7" filter="url(#neonPink)" />
  <circle cx="160" cy="68" r="3" fill="#FF36B7" />
  <circle cx="148" cy="145" r="3" fill="#925CFF" />
  <circle cx="265" cy="95" r="3.5" fill="#22D3EE" filter="url(#neonBlue)" />
  <circle cx="240" cy="68" r="3" fill="#22D3EE" />
  <circle cx="252" cy="145" r="3" fill="#168BFF" />
  <circle cx="200" cy="55" r="3" fill="#FFFFFF" />

  <!-- Connecting Central Bridge Nodes -->
  <line x1="195" y1="115" x2="205" y2="115" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" />
  <line x1="195" y1="135" x2="205" y2="135" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" />

  <!-- AI Glowing Badge on Bottom Right (matches reference image) -->
  <g transform="translate(305, 145)">
    <rect width="44" height="44" rx="10" fill="#060C1E" stroke="#168BFF" stroke-width="2" filter="url(#neonBlue)" />
    <rect x="2" y="2" width="40" height="40" rx="8" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.6" />
    <text x="22" y="28" font-family="'Orbitron', monospace, sans-serif" font-size="16" font-weight="900" fill="#22D3EE" text-anchor="middle" letter-spacing="1">AI</text>
  </g>
</svg>

