<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140826" />
      <stop offset="100%" stop-color="#04060E" />
    </radialGradient>
    <filter id="neonGlowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGrad)" rx="14" />

  <!-- Cyber Grid Lines -->
  <g stroke="#925CFF" stroke-opacity="0.12" stroke-width="1">
    <line x1="20" y1="40" x2="380" y2="40" />
    <line x1="20" y1="80" x2="380" y2="80" />
    <line x1="20" y1="120" x2="380" y2="120" />
    <line x1="20" y1="160" x2="380" y2="160" />
    <line x1="20" y1="200" x2="380" y2="200" />
    <line x1="60" y1="20" x2="60" y2="220" />
    <line x1="120" y1="20" x2="120" y2="220" />
    <line x1="180" y1="20" x2="180" y2="220" />
    <line x1="240" y1="20" x2="240" y2="220" />
    <line x1="300" y1="20" x2="300" y2="220" />
    <line x1="360" y1="20" x2="360" y2="220" />
  </g>

  <!-- Central Microservices / Kafka Network Node -->
  <circle cx="200" cy="120" r="42" stroke="#925CFF" stroke-width="2.5" fill="#080318" filter="url(#neonGlowViolet)" />
  <circle cx="200" cy="120" r="26" stroke="#B58AFF" stroke-width="1.5" stroke-dasharray="4 4" fill="none" />
  
  <!-- Server / Microservices Monogram inside -->
  <path d="M185 110L200 102L215 110L200 118Z" fill="#925CFF" fill-opacity="0.6" stroke="#B58AFF" stroke-width="1.5" />
  <path d="M185 120L200 128L215 120" stroke="#B58AFF" stroke-width="1.5" fill="none" />
  <path d="M185 130L200 138L215 130" stroke="#B58AFF" stroke-width="1.5" fill="none" />

  <!-- Radiating Data Streams & Nodes -->
  <!-- Left Node -->
  <path d="M158 120L90 120L65 80" stroke="#22D3EE" stroke-width="2" filter="url(#neonGlowCyan)" />
  <circle cx="65" cy="80" r="7" fill="#061224" stroke="#22D3EE" stroke-width="2" />
  <circle cx="65" cy="80" r="3" fill="#22D3EE" />

  <!-- Bottom Left Node -->
  <path d="M165 145L110 180" stroke="#925CFF" stroke-width="2" />
  <circle cx="110" cy="180" r="6" fill="#0E0520" stroke="#925CFF" stroke-width="2" />

  <!-- Right Node -->
  <path d="M242 120L310 120L335 160" stroke="#FF36B7" stroke-width="2" filter="url(#neonGlowViolet)" />
  <circle cx="335" cy="160" r="7" fill="#1C061C" stroke="#FF36B7" stroke-width="2" />
  <circle cx="335" cy="160" r="3" fill="#FF36B7" />

  <!-- Top Right Node -->
  <path d="M235 95L290 60" stroke="#22D3EE" stroke-width="2" />
  <circle cx="290" cy="60" r="6" fill="#061224" stroke="#22D3EE" stroke-width="2" />

  <!-- Data Stream Packets -->
  <circle cx="120" cy="120" r="3" fill="#22D3EE" />
  <circle cx="276" cy="120" r="3" fill="#FF36B7" />
  <circle cx="140" cy="160" r="2.5" fill="#925CFF" />
  <circle cx="260" cy="80" r="2.5" fill="#22D3EE" />

  <!-- Tech Badge -->
  <rect x="145" y="196" width="110" height="24" rx="12" fill="#0B061E" stroke="#925CFF" stroke-width="1.5" />
  <text x="200" y="212" font-family="'Orbitron', monospace, sans-serif" font-size="9" font-weight="700" fill="#E2D4FF" text-anchor="middle" letter-spacing="1">EVENT-DRIVEN</text>
</svg>

