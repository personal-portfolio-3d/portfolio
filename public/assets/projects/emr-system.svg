  <rect x="284" y="260" width="145" height="42" rx="6" fill="#101F38" stroke="#168BFF" stroke-width="1" />
  <text x="296" y="278" fill="#71839F" font-family="monospace" font-size="9">HEMODYNAMICS</text>
  <text x="296" y="294" fill="#22D3EE" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold">118 / 78 mmHg</text>

  <rect x="445" y="260" width="145" height="42" rx="6" fill="#101F38" stroke="#168BFF" stroke-width="1" />
  <text x="457" y="278" fill="#71839F" font-family="monospace" font-size="9">AI PHI REDACTION</text>
  <text x="457" y="294" fill="#168BFF" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold">100% SANITIZED</text>

  <rect x="606" y="260" width="154" height="42" rx="6" fill="#101F38" stroke="#6D45E8" stroke-width="1" />
  <text x="618" y="278" fill="#71839F" font-family="monospace" font-size="9">AUDIO DICTATION AI</text>
  <text x="618" y="294" fill="#B58AFF" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold">ACTIVE STREAM</text>

  <!-- Bottom Panel: AI Document Extraction Pipeline -->
  <rect x="260" y="328" width="516" height="128" rx="10" fill="#0A1425" stroke="#24466E" stroke-width="1.5" />
  <text x="284" y="356" fill="#A5B6D0" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">AUTOMATED CLINICAL ENCOUNTER PROCESSING</text>
  
  <rect x="284" y="372" width="140" height="66" rx="6" fill="#081426" stroke="#168BFF" stroke-width="1" />
  <text x="296" y="394" fill="#EDF4FF" font-family="sans-serif" font-size="11" font-weight="bold">1. Ingestion</text>
  <text x="296" y="412" fill="#71839F" font-family="monospace" font-size="10">Multi-clinic DICOM</text>

  <rect x="448" y="372" width="140" height="66" rx="6" fill="#081426" stroke="#22D3EE" stroke-width="1" />
  <text x="460" y="394" fill="#22D3EE" font-family="sans-serif" font-size="11" font-weight="bold">2. AI Pipeline</text>
  <text x="460" y="412" fill="#71839F" font-family="monospace" font-size="10">De-identification</text>

  <rect x="612" y="372" width="148" height="66" rx="6" fill="#081426" stroke="#6D45E8" stroke-width="1" />
  <text x="624" y="394" fill="#B58AFF" font-family="sans-serif" font-size="11" font-weight="bold">3. Microservice</text>
  <text x="624" y="412" fill="#71839F" font-family="monospace" font-size="10">RBAC Vault Store</text>
</svg>

