<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#168BFF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1B2A40" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
  </g>

  <!-- Top App Navigation Bar -->
  <rect x="24" y="24" width="752" height="48" rx="8" fill="#0A1425" stroke="#24466E" stroke-width="1.5" />
  <circle cx="50" cy="48" r="6" fill="#168BFF" />
  <circle cx="70" cy="48" r="6" fill="#22D3EE" />
  <circle cx="90" cy="48" r="6" fill="#6D45E8" />
  <text x="120" y="53" fill="#EDF4FF" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" letter-spacing="1">ADVANCED MEDICS // ONCOLOGY CLINICAL EMR</text>
  <rect x="630" y="34" width="130" height="28" rx="6" fill="#081426" stroke="#22D3EE" stroke-width="1" />
  <text x="645" y="52" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="bold">HIPAA VERIFIED</text>

  <!-- Left Sidebar / Patient List -->
  <rect x="24" y="86" width="220" height="370" rx="10" fill="#0A1425" stroke="#24466E" stroke-width="1.5" />
  <text x="44" y="116" fill="#A5B6D0" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">PATIENT ROSTER (48 ACTIVE)</text>
  
  <!-- Patient Row 1 (Selected) -->
  <rect x="36" y="132" width="196" height="54" rx="8" fill="#101F38" stroke="#168BFF" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="60" cy="159" r="14" fill="#081426" stroke="#22D3EE" stroke-width="1.5" />
  <text x="54" y="163" fill="#22D3EE" font-family="sans-serif" font-size="12" font-weight="bold">JD</text>
  <text x="84" y="152" fill="#EDF4FF" font-family="sans-serif" font-size="12" font-weight="bold">John Doe (46y)</text>
  <text x="84" y="170" fill="#22D3EE" font-family="monospace" font-size="10">Stage II Oncology Protocol</text>

  <!-- Patient Row 2 -->
  <rect x="36" y="196" width="196" height="50" rx="8" fill="#081426" stroke="#1B2A40" stroke-width="1" />
  <circle cx="60" cy="221" r="12" fill="#0A1425" />
  <text x="56" y="225" fill="#A5B6D0" font-family="sans-serif" font-size="10">SM</text>
  <text x="84" y="217" fill="#A5B6D0" font-family="sans-serif" font-size="12">Sarah Miller</text>
  <text x="84" y="233" fill="#71839F" font-family="monospace" font-size="10">Follow-up Encounter</text>

  <!-- Patient Row 3 -->
  <rect x="36" y="256" width="196" height="50" rx="8" fill="#081426" stroke="#1B2A40" stroke-width="1" />
  <circle cx="60" cy="281" r="12" fill="#0A1425" />
  <text x="56" y="285" fill="#A5B6D0" font-family="sans-serif" font-size="10">RK</text>
  <text x="84" y="277" fill="#A5B6D0" font-family="sans-serif" font-size="12">Robert King</text>
  <text x="84" y="293" fill="#71839F" font-family="monospace" font-size="10">Biopsy Diagnostic</text>

  <!-- Main Center Clinical Chart View -->
  <rect x="260" y="86" width="516" height="230" rx="10" fill="#0A1425" stroke="#24466E" stroke-width="1.5" />
  <text x="284" y="116" fill="#EDF4FF" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold">CLINICAL VITALS & ENCOUNTER TELEMETRY</text>
  
  <!-- Vitals Graph -->
  <path d="M 284 240 L 340 210 L 400 230 L 460 170 L 520 200 L 580 150 L 640 180 L 700 130 L 744 140" fill="none" stroke="url(#blueGlow)" stroke-width="3" filter="url(#glow)" />
  <circle cx="460" cy="170" r="4" fill="#22D3EE" />
  <circle cx="580" cy="150" r="4" fill="#22D3EE" />
  <circle cx="700" cy="130" r="4" fill="#22D3EE" />
  
